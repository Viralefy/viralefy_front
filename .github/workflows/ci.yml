name: CI

# TODO(secrets): defina SENTRY_AUTH_TOKEN nos repo secrets pra ativar o
# upload de sourcemaps. Sem ele, o passo abaixo é skipped (só roda em main).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.viralefy.com
      NEXT_PUBLIC_API_URL: https://api.viralefy.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: unit tests
        run: npm test

      - name: next build
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: viralefy
          SENTRY_PROJECT_FRONT: viralefy-front

      - name: Upload sourcemaps to Sentry
        if: github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: viralefy
          SENTRY_PROJECT: viralefy-front
        run: |
          npx @sentry/cli releases new ${{ github.sha }}
          npx @sentry/cli releases files ${{ github.sha }} upload-sourcemaps ./.next
          npx @sentry/cli releases finalize ${{ github.sha }}

  npm-audit:
    runs-on: ubuntu-latest
    # BLOQUEANTE desde 2026-07-25: o baseline de PRODUÇÃO está limpo (0 high/
    # critical). Antes era `--audit-level=high` cru (todas as deps), que ficava
    # vermelho por ferramentas de DEV (storybook/lhci e suas cadeias) que NUNCA
    # são servidas ao usuário. Agora o gate roda `scripts/audit-ci.mjs`, que
    # audita só as deps de runtime (`--omit=dev`) e falha determinísticamente em
    # qualquer high/critical fora da allowlist documentada. Higiene das deps de
    # dev fica pro Renovate (não bloqueia, não shippa).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: npm audit (produção, high+)
        run: node scripts/audit-ci.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A gitleaks-action@v2 exige licença paga para organizações e falhava com
      # "missing gitleaks license". O binário oficial é o mesmo scanner, sem licença.
      - name: gitleaks (binário oficial, histórico completo)
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
